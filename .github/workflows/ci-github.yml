name: builds on Linux

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ develop ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  #workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
            
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7

      # installs accendino, builds in .accendino/ci and caches the platform packages and ccache
      # between runs
      - name: Build RDP mocks
        uses: forgiare/accendino@master
        with:
          file: rdp-mocks.accendino
          targets: rdp-mocks
          extra-args: --prefix=/tmp/rdpmocks

      - name: Run unitary test
        run: meson test --print-errorlogs -C .accendino/ci/build/Ubuntu-Gcc-x86_64-release/rdp-mocks

